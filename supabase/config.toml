# Configuración del proyecto Supabase (se completa el project_id al crear el
# proyecto remoto). Edge functions con verify_jwt = false + validación interna
# (P-API-05 / E14).
project_id = "gestion-global"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"

# Las edge functions se declararán acá a medida que se creen (Fase 1: ARCA).
# Ejemplo:
# [functions.arca-autorizar-comprobante]
# verify_jwt = false

# send-certificado-email (DGG-100 Etapa B): EXCEPCIÓN justificada a la convención
# verify_jwt=false. Se dispara SÓLO desde la UI del gerente (siempre manda JWT),
# así que el gateway rechaza requests sin JWT antes de ejecutar; adentro además
# valida profiles.role staff. Ver comentario de cabecera del index.ts.
[functions.send-certificado-email]
verify_jwt = true

# send-constancia-email (chunk CONST): gemela de send-certificado-email — misma
# excepción justificada (caller SIEMPRE gerente logueado; doble check de rol adentro).
[functions.send-constancia-email]
verify_jwt = true

# alta-cliente-portal (Auditoría 2026-09 · C2): verify_jwt=false a propósito —
# tiene DOS callers legítimos (trigger pg_net con service_role, y el wizard de
# gerencia con JWT de staff) y hace su propio auth-gate interno (service_role OR
# profiles.role ∈ {gerente,operador}). NO subir a verify_jwt=true sin revisar: el
# gateway igual dejaría pasar la anon key (es un JWT válido); la barrera real es
# el gate interno. Se fija acá para que un deploy por CLI no lo flipee al default.
[functions.alta-cliente-portal]
verify_jwt = false

# gmail-pubsub-webhook (Auditoría 2026-09): verify_jwt=false a propósito. Hoy es un
# stub; el POST está gateado internamente por service_role (antes el camino de
# testing manual era anon-callable y falseaba sent_emails.webhook_status). Cuando se
# cablee el Pub/Sub real de Google deberá verificar el OIDC del push subscription.
[functions.gmail-pubsub-webhook]
verify_jwt = false

# dispatch-emails: cron drainer de email_queue. verify_jwt=false A PROPÓSITO —
# la auth es CRON_SECRET/service_role validado ADENTRO (AUDIT-011); con verify_jwt=true
# la plataforma rechaza el bearer del cron con 401 ANTES del código (lección DGG-113).
# Estaba deployado en false pero SIN declarar acá → un deploy por CLI lo habría flipeado
# a true y roto TODO el envío de correos. Se fija explícito (DGG-224).
[functions.dispatch-emails]
verify_jwt = false

# email-baja (DGG-220 Fase 2): endpoint PÚBLICO de baja/unsubscribe. verify_jwt=false
# a propósito — el unsubscribe (incl. List-Unsubscribe-Post one-click, RFC 8058) debe
# ser alcanzable SIN login; la barrera real es el token de 128 bits por prospecto.
# Se fija acá para que un deploy por CLI no lo flipee a true y rompa el one-click.
[functions.email-baja]
verify_jwt = false

# tramix-prospectos (DGG-220 Fase 1c): goteo de enriquecimiento. verify_jwt=false;
# auth interna por is_cron_token (cron_secret del vault). Igual que tramix-backfill.
[functions.tramix-prospectos]
verify_jwt = false

# tramix-cierre-scrape (DGG-225): worker de refresco de cache para el agente de cierre.
# verify_jwt=false; auth interna por is_cron_token (cron_secret del vault). Escribe
# tramix_cache con la lista completa de expedientes (lo que faltaba). Igual que tramix-backfill.
[functions.tramix-cierre-scrape]
verify_jwt = false

# prospectos-reimport-padron (DGG-221): re-import del padrón cada 10 días desde el
# CSV público de la planilla. verify_jwt=false; auth interna por is_cron_token.
[functions.prospectos-reimport-padron]
verify_jwt = false

# dispatch-vencimientos: cron diario de alertas de vencimiento. verify_jwt=false A
# PROPÓSITO — la auth es CRON_SECRET validado ADENTRO (mismo patrón que dispatch-emails);
# con verify_jwt=true la plataforma rechaza el bearer del cron (private.cron_bearer())
# con 401 ANTES del código. Estaba deployado en false pero SIN declarar acá → un deploy
# (CLI o MCP) lo flipeaba a true y rompía el cron. Se fija explícito (DGG-231).
[functions.dispatch-vencimientos]
verify_jwt = false
